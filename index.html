<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Virtual Biometric Attendance</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #0f172a; color: white; margin: 0; padding: 20px; }
    .video-container { position: relative; width: 340px; height: 255px; border-radius: 12px; overflow: hidden; border: 2px solid #38bdf8; background: #000; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #status { margin-top: 15px; font-weight: bold; color: #38bdf8; text-align: center; max-width: 340px; }
    .log-box { margin-top: 15px; background: #1e293b; padding: 12px; border-radius: 8px; width: 320px; font-size: 13px; min-height: 40px; max-height: 150px; overflow-y: auto; }
    .btn { margin-top: 12px; background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Smart Attendance System</h2>
  <div class="video-container">
    <video id="video" autoplay muted playsinline></video>
  </div>
  <div id="status">Starting camera...</div>
  <button id="registerBtn" class="btn" style="display:none;" onclick="registerFace()">Register My Face</button>
  <div class="log-box" id="logs">Waiting for system init...</div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwi3mfDwl5NxjBH06LX7sFzgnNz52_t-EUb-9KppbD9nodXjsdfsTcDj7mq00lYgYpM/exec";

    const video = document.getElementById('video');
    const statusText = document.getElementById('status');
    const logBox = document.getElementById('logs');
    const registerBtn = document.getElementById('registerBtn');
    
    let markedStudents = new Set();
    let faceMatcher = null;
    let attendanceInterval = null;

    async function init() {
      const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
      
      try {
        statusText.innerText = "Loading AI models...";
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);

        await startCamera();
        await loadEnrolledStudents();
      } catch (err) {
        statusText.innerText = "Init Error: " + err.message;
      }
    }

    // Fixed Bug 1: Await metadata to prevent black screen / premature inference
    function startCamera() {
      return new Promise((resolve, reject) => {
        navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
        })
        .then(stream => {
          video.srcObject = stream;
          video.onloadedmetadata = () => {
            video.play();
            statusText.innerText = "Camera active. Loading profiles...";
            resolve();
          };
        })
        .catch(err => {
          statusText.innerText = "Camera permission denied: " + err.message;
          reject(err);
        });
      });
    }

    // Fixed Bug 2 & 3: Multi-student loop with individual error isolation
    async function loadEnrolledStudents() {
      const students = [
        { name: "Rudresh Sahu", imgUrl: "./student1.jpg" },
        { name: "Tanmay Sanap", imgUrl: "./student2.jpg" }
      ];

      const labeledDescriptors = [];

      for (const student of students) {
        try {
          const img = await faceapi.fetchImage(student.imgUrl);
          const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                                         .withFaceLandmarks()
                                         .withFaceDescriptor();

          if (detection) {
            labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(student.name, [detection.descriptor]));
            logBox.innerHTML += `<div>Loaded profile: <b>${student.name}</b></div>`;
          } else {
            console.warn(`No face detected in ${student.imgUrl}`);
          }
        } catch (e) {
          console.warn(`Could not load ${student.imgUrl}`);
        }
      }

      if (labeledDescriptors.length > 0) {
        faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55);
        statusText.innerText = `Ready (${labeledDescriptors.length} enrolled). Align face with camera.`;
        startAttendanceLoop();
      } else {
        fallbackToManualRegister("No preloaded faces found.");
      }
    }

    function fallbackToManualRegister(reason) {
      statusText.innerText = reason + " Look at camera & click button below:";
      registerBtn.style.display = "inline-block";
    }

    async function registerFace() {
      const name = prompt("Enter Student Name:", "Student");
      if (!name) return;

      statusText.innerText = "Scanning face from camera...";
      const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                                     .withFaceLandmarks()
                                     .withFaceDescriptor();

      if (!detection) {
        statusText.innerText = "No face detected. Look directly into lens and try again.";
        return;
      }

      const labeledDesc = new faceapi.LabeledFaceDescriptors(name, [detection.descriptor]);
      faceMatcher = new faceapi.FaceMatcher([labeledDesc], 0.55);
      
      registerBtn.style.display = "none";
      statusText.innerText = `Face registered for ${name}! Running attendance...`;
      startAttendanceLoop();
    }

    function startAttendanceLoop() {
      if (attendanceInterval) clearInterval(attendanceInterval);

      attendanceInterval = setInterval(async () => {
        if (!faceMatcher || video.paused || video.ended) return;

        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                                        .withFaceLandmarks()
                                        .withFaceDescriptors();

        if (detections.length === 0) {
          statusText.innerText = "No face detected in camera.";
          return;
        }

        for (const d of detections) {
          const match = faceMatcher.findBestMatch(d.descriptor);

          if (match.label === 'unknown') {
            statusText.innerText = "Face not recognized / Access Denied";
          } else {
            if (!markedStudents.has(match.label)) {
              markedStudents.add(match.label);
              logAttendance(match.label);
            } else {
              statusText.innerText = `Attendance already marked for ${match.label}`;
            }
          }
        }
      }, 1500);
    }

    async function logAttendance(studentName) {
      statusText.innerText = `Recognized: ${studentName}! Logging...`;
      logBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] Verified: <b>${studentName}</b></div>`;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: studentName, status: "Present" })
        });
        statusText.innerText = `Attendance successfully recorded for ${studentName}!`;
      } catch (err) {
        logBox.innerHTML += `<div style="color:red">Failed to write to Google Sheet.</div>`;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
