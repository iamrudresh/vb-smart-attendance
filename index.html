<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Virtual Biometric Attendance</title>
  <!-- Load Face-API.js from CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background: #0f172a; color: white; margin: 0; padding: 20px; }
    .video-container { position: relative; width: 340px; height: 255px; border-radius: 12px; overflow: hidden; border: 2px solid #38bdf8; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #status { margin-top: 15px; font-weight: bold; color: #38bdf8; text-align: center; }
    .log-box { margin-top: 15px; background: #1e293b; padding: 12px; border-radius: 8px; width: 320px; font-size: 13px; }
  </style>
</head>
<body>

  <h2>Smart Attendance System</h2>
  <div class="video-container">
    <video id="video" autoplay muted playsinline></video>
  </div>
  <div id="status">Initializing AI models...</div>
  <div class="log-box" id="logs">Waiting for detection...</div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT URL HERE
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwi3mfDwl5NxjBH06LX7sFzgnNz52_t-EUb-9KppbD9nodXjsdfsTcDj7mq00lYgYpM/exec";

    const video = document.getElementById('video');
    const statusText = document.getElementById('status');
    const logBox = document.getElementById('logs');
    
    let markedStudents = new Set();
    let faceMatcher = null;

    async function init() {
      const MODEL_URL = 'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights';
      
      // Load optimized neural nets
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);

      statusText.innerText = "Training reference faces...";
      faceMatcher = await setupFaceMatcher();

      startCamera();
    }

    async function setupFaceMatcher() {
      // Register reference students (URLs must allow CORS, e.g., GitHub raw or Imgur direct link)
      const students = [
        { name: "Student_01", imgUrl: "https://raw.githubusercontent.com/iamrudresh/vb-smart-attendance/main/student1.jpg" }
      ];

      const labeledDescriptors = await Promise.all(
        students.map(async (student) => {
          const img = await faceapi.fetchImage(student.imgUrl);
          const detection = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
          return new faceapi.LabeledFaceDescriptors(student.name, [detection.descriptor]);
        })
      );

      return new faceapi.FaceMatcher(labeledDescriptors, 0.6);
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } 
      })
      .then(stream => {
        video.srcObject = stream;
        statusText.innerText = "System Active. Align face with camera.";
        runRecognition();
      })
      .catch(err => {
        statusText.innerText = "Camera Access Error: " + err.message;
      });
    }

    function runRecognition() {
      setInterval(async () => {
        if (!faceMatcher) return;

        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                                        .withFaceLandmarks()
                                        .withFaceDescriptors();

        for (const detection of detections) {
          const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
          
          if (bestMatch.label !== 'unknown' && !markedStudents.has(bestMatch.label)) {
            markedStudents.add(bestMatch.label);
            logAttendance(bestMatch.label);
          }
        }
      }, 1500); // Scans every 1.5 seconds to prevent browser throttle
    }

    async function logAttendance(studentName) {
      statusText.innerText = `Recognized: ${studentName}! Logging...`;
      logBox.innerHTML += `<div>[${new Date().toLocaleTimeString()}] Verified: <b>${studentName}</b></div>`;

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: studentName, status: "Present" })
        });
        statusText.innerText = `Attendance marked for ${studentName}!`;
      } catch (err) {
        logBox.innerHTML += `<div style="color:red">Failed to log to Sheet</div>`;
      }
    }

    window.onload = init;
  </script>
</body>
</html>
